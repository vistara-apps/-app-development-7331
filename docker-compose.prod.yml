version: '3.8'

services:
  rightcheck-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - VITE_APP_NAME=RightCheck
      - VITE_APP_VERSION=1.0.0
      - VITE_FARCASTER_HUB_URL=https://hub-api.farcaster.xyz:2281
      - VITE_CHAT_AGENT_URL=https://api.base.org/chat-agents/v1
      - VITE_PAYMENT_URL=https://payments.vistara.dev
      - VITE_BASE_NETWORK=base
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rightcheck.rule=Host(`rightcheck.app`)"
      - "traefik.http.routers.rightcheck.tls=true"
      - "traefik.http.routers.rightcheck.tls.certresolver=letsencrypt"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - rightcheck-app
    restart: unless-stopped

networks:
  default:
    name: rightcheck-network
